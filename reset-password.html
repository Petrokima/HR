<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src https://hckkrzghxxhauotyqlqr.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Petrokima HR — new password</title>
<link rel="icon" href="icon-192.png">
<link href="fonts/cairo.css?v=5.3.0" rel="stylesheet">
<style>
:root{--red:#E93326;--navy:#02102B;--ink:#1c2333;--muted:#5d6678;--line:#e3e6ec;--bg:#f5f6f8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.6}
header{background:var(--navy);color:#fff;padding:16px}
.top{max-width:460px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{background:#fff;color:var(--red);font-weight:800;letter-spacing:.5px;padding:4px 12px;border-radius:9px}
.lang{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
main{max-width:460px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
h1{font-size:22px;margin:0 0 8px}
p{margin:6px 0}
label{display:block;font-weight:700;margin:14px 0 4px;font-size:14px}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid #c9ced8;border-radius:10px;background:#fff}
input:focus{outline:2px solid #9db4f0;border-color:#1F4FB5}
.rules{color:var(--muted);font-size:14px;margin:10px 0 0}
.btn{display:block;width:100%;margin-top:16px;background:var(--red);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.err{color:#b42318;background:#fdecea;border-radius:10px;padding:10px 12px;margin-top:14px}
.ok{color:#05603a;background:#e8f7ef;border-radius:10px;padding:12px;margin-top:4px}
.muted{color:var(--muted);font-size:14px}
.show{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;font-weight:400}
.show input{width:auto}
[hidden]{display:none !important}
</style>
</head>
<body>
<header><div class="top"><span class="logo">PETROKIMA</span><button class="lang" type="button" id="rp-lang">العربية</button></div></header>
<main>
  <div class="card">
    <div id="rp-wait"><p id="rp-wait-text">Checking the link…</p></div>
    <div id="rp-dead" hidden><h1 id="rp-dead-title"></h1><p id="rp-dead-text"></p></div>
    <form id="rp-form" hidden novalidate>
      <h1 id="rp-title"></h1>
      <p class="muted" id="rp-for"></p>
      <label for="rp-p1" id="rp-l1"></label>
      <input id="rp-p1" type="password" autocomplete="new-password" maxlength="72" required>
      <label for="rp-p2" id="rp-l2"></label>
      <input id="rp-p2" type="password" autocomplete="new-password" maxlength="72" required>
      <label class="show"><input type="checkbox" id="rp-show"> <span id="rp-show-text"></span></label>
      <p class="rules" id="rp-rules"></p>
      <button class="btn" type="submit" id="rp-go"></button>
      <div class="err" id="rp-err" hidden></div>
    </form>
    <div id="rp-done" hidden><h1 id="rp-done-title"></h1><div class="ok" id="rp-done-text"></div><p class="muted" id="rp-done-more"></p></div>
  </div>
</main>
<script src="reset-password.js?v=1"></script>
</body>
</html>
