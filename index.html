<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Petrokima">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Petrokima</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f9;--card:#fff;--line:#e3e7ef;--text:#15192a;--muted:#6b7389;--brand:#1f4fb5;--brand2:#0f9d7a;--danger:#d23b3b;--warn:#c06a17;--radius:16px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;
  padding-top:env(safe-area-inset-top,0px)}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:16px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 1px 3px rgba(20,30,60,.06);padding:18px;margin-bottom:14px}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
h1{font-size:22px;font-weight:800;text-align:center}
.sub{color:var(--muted);font-size:13px;text-align:center;margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--text);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.field textarea{min-height:90px;resize:vertical}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:14px;font-size:16px;font-weight:700;color:#fff;background:var(--brand)}
.btn:disabled{opacity:.55}
.btn.green{background:var(--brand2)} .btn.red{background:var(--danger)} .btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn.small{padding:10px 14px;font-size:14px;width:auto;border-radius:10px}
.row{display:flex;gap:10px}
.err{background:#fdecec;color:var(--danger);border-radius:12px;padding:11px 13px;font-size:14px;margin-top:12px;display:none;line-height:1.6}
.muted{color:var(--muted)}
/* top bar + tabs */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top .who{flex:1;min-width:0}
.top .name{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{font-size:12px;color:var(--muted)}
.iconbtn{background:var(--bg);color:var(--text);border-radius:10px;padding:8px 11px;font-size:14px;font-weight:700}
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.view{display:none}.view.on{display:block}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;background:none;color:var(--muted);font-size:11.5px;font-weight:700;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab .ic{font-size:21px;line-height:1.1}
.tab.on{color:var(--brand);background:#eef3ff}
/* clock card */
.clock{text-align:center;padding:22px 18px}
.clock .time{font-size:44px;font-weight:800;letter-spacing:1px;direction:ltr}
.clock .date{color:var(--muted);font-size:14px;margin-bottom:14px}
.state{border-radius:14px;padding:14px;margin:6px 0 16px;font-size:15px;line-height:1.6}
.state.off{background:#f1f3f8;color:var(--muted)}
.state.on{background:#e6f7f2;color:#08694f}
.state.warn{background:#fff4e5;color:var(--warn)}
.state b{color:inherit}
.big{font-size:18px;padding:18px}
.list .it{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border-bottom:none}
.it .grow{flex:1;min-width:0}
.it .t1{font-weight:700;font-size:14.5px}
.it .t2{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:700}
.sec{font-weight:800;font-size:15px;margin:4px 0 10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.c-green{background:#e3f6ef;color:#08694f}.c-orange{background:#fff1dd;color:#9a5410}.c-red{background:#fde8e8;color:#b02a2a}.c-grey{background:#eef0f4;color:#5c6478}.c-blue{background:#e8efff;color:#1f4fb5}
.empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:end}
/* bottom sheet */
.sheet{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet-box{background:var(--card);width:100%;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:14px}
.site{display:block;width:100%;text-align:start;background:var(--bg);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--text)}
.site b{display:block;font-size:14.5px}.site span{font-size:12.5px;color:var(--muted)}
.site.sel{outline:2px solid var(--brand);background:#eef3ff}
.hint{font-size:13px;color:var(--muted);line-height:1.7;margin:-4px 0 14px}
.hint b{color:var(--text)}
.neg{color:var(--danger)}.pos{color:#08694f}
#toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:60;background:#15192a;color:#fff;border-radius:14px;padding:13px 16px;font-size:14.5px;font-weight:600;text-align:center;
  transform:translateY(30px);opacity:0;pointer-events:none;transition:all .25s}
#toast.on{transform:none;opacity:1}
#toast.bad{background:var(--danger)}
#offline{display:none;background:var(--warn);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{display:flex;justify-content:center;padding:40px}
.loading .spin{border-color:var(--line);border-top-color:var(--brand)}
</style>
</head>
<body>
<div id="offline" data-t="offline"></div>

<!-- LOGIN -->
<section class="screen" id="scr-login"><div class="center"><div style="width:100%;max-width:400px">
  <div class="logo">PK</div><h1 data-t="appName"></h1><div class="sub" data-t="loginSub"></div>
  <div class="card" style="margin-top:22px">
    <div class="field"><label data-t="empCode"></label><input id="li-code" inputmode="text" autocomplete="username" autocapitalize="off"></div>
    <div class="field"><label data-t="password"></label><input id="li-pass" type="password" autocomplete="current-password"></div>
    <button class="btn" id="li-go" data-t="signIn"></button>
    <div class="err" id="li-err"></div>
  </div>
  <div class="sub" style="margin-top:6px"><button class="iconbtn" data-lang>English</button></div>
  <div class="sub" style="margin-top:12px" data-t="forgot"></div>
</div></div></section>

<!-- FIRST SIGN-IN -->
<section class="screen" id="scr-first"><div class="center"><div style="width:100%;max-width:400px">
  <div class="logo">PK</div><h1 data-t="firstTitle"></h1><div class="sub" data-t="firstSub"></div>
  <div class="card" style="margin-top:22px">
    <div class="field"><label data-t="nid4"></label><input id="fl-nid" inputmode="numeric" maxlength="4" autocomplete="off" style="direction:ltr;text-align:center;letter-spacing:6px;font-size:20px"></div>
    <div class="field"><label data-t="newPass"></label><input id="fl-p1" type="password" autocomplete="new-password"></div>
    <div class="field"><label data-t="repeatPass"></label><input id="fl-p2" type="password" autocomplete="new-password"></div>
    <button class="btn" id="fl-go" data-t="savePass"></button>
    <div class="err" id="fl-err"></div>
  </div>
  <button class="btn ghost" data-act="signout" data-t="signOut"></button>
</div></div></section>

<!-- MESSAGE (no access etc.) -->
<section class="screen" id="scr-msg"><div class="center"><div style="width:100%;max-width:400px;text-align:center">
  <div class="logo">PK</div><div class="card" id="msg-body" style="line-height:1.8"></div>
  <button class="btn ghost" data-act="signout" data-t="signOut"></button>
</div></div></section>

<!-- MAIN -->
<section class="screen" id="scr-main">
  <div class="top">
    <div class="who"><div class="name" id="me-name"></div><div class="meta" id="me-meta"></div></div>
    <button class="iconbtn" data-act="refresh" aria-label="refresh">⟳</button>
    <button class="iconbtn" data-lang>English</button>
  </div>
  <main>
    <!-- HOME -->
    <div class="view on" id="v-home">
      <div class="card clock">
        <div class="time" id="clk-time">--:--</div>
        <div class="date" id="clk-date"></div>
        <div id="clk-state"></div>
        <div id="clk-btns"></div>
        <div class="muted" style="font-size:12px;margin-top:12px" data-t="locNote"></div>
      </div>
      <div class="card"><div class="sec" data-t="today"></div><div class="list" id="today-list"></div></div>
      <div class="card"><div class="sec" id="month-title"></div><div class="list" id="month-list"></div></div>
    </div>
    <!-- REQUESTS -->
    <div class="view" id="v-req">
      <div class="stats" id="req-stats"></div>
      <div style="display:grid;gap:10px;margin-bottom:14px">
        <button class="btn" data-act="req-leave">🌴 <span data-t="reqLeave"></span></button>
        <button class="btn" data-act="req-perm">✋ <span data-t="reqPerm"></span></button>
        <button class="btn ghost" data-act="req-hr">📨 <span data-t="reqOther"></span></button>
      </div>
      <div class="card"><div class="sec" data-t="myRequests"></div><div class="list" id="req-list"></div></div>
    </div>
    <!-- PAYSLIPS -->
    <div class="view" id="v-pay"><div class="card"><div class="sec" data-t="payslips"></div><div class="list" id="pay-list"></div></div></div>
    <!-- PROFILE -->
    <div class="view" id="v-prof">
      <div class="card" id="prof-card"></div>
      <div class="card" id="install-card" style="display:none"></div>
      <div style="display:grid;gap:10px">
        <button class="btn ghost" data-act="chpass">🔑 <span data-t="changePass"></span></button>
        <button class="btn red" data-act="signout" data-t="signOut"></button>
      </div>
    </div>
  </main>
  <nav class="tabbar">
    <button class="tab on" data-view="home"><span class="ic">⏱</span><span data-t="home"></span></button>
    <button class="tab" data-view="req"><span class="ic">📋</span><span data-t="requests"></span></button>
    <button class="tab" data-view="pay"><span class="ic">💰</span><span data-t="payslips"></span></button>
    <button class="tab" data-view="prof"><span class="ic">👤</span><span data-t="profile"></span></button>
  </nav>
</section>

<div class="sheet" id="sheet"><div class="sheet-box"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div id="toast"></div>
<div id="boot" class="loading"><div class="spin"></div></div>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const pad = n => String(n).padStart(2,'0');
const loc = () => LANG==='ar' ? 'ar-EG' : 'en-GB';
const fmt = v => num(v).toLocaleString(loc(), { maximumFractionDigits:2 });
const fmtH = v => num(v).toLocaleString(loc(), { maximumFractionDigits:2 }) + ' ' + t('hours');
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function dObj(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y, m-1, d); }
function dStr(o){ return `${o.getFullYear()}-${pad(o.getMonth()+1)}-${pad(o.getDate())}`; }
function niceDate(s){ return s ? dObj(s).toLocaleDateString(loc(), { weekday:'short', day:'numeric', month:'short' }) : ''; }
function toMin(x){ const [h,m]=String(x||'0:0').split(':').map(Number); return h*60+m; }
let toastT;
function toast(msg, bad){ const el=$('toast'); el.textContent=msg; el.className = 'on' + (bad?' bad':''); clearTimeout(toastT); toastT=setTimeout(()=>el.className='',3200); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on', s.id===id)); $('boot').style.display='none'; }

function chip(s){ const c={Pending:'c-orange',Approved:'c-green',Completed:'c-green','In progress':'c-blue',Rejected:'c-red',Cancelled:'c-grey'}[s]||'c-grey'; return `<span class="chip ${c}">${esc(tm('st',s))}</span>`; }
function friendly(msg){
  msg = String(msg||'');
  if (/ALREADY_IN/.test(msg)) return t('alreadyIn');
  if (/NOT_IN/.test(msg)) return t('notInErr');
  if (/approved and locked/i.test(msg)) return t('lockedPeriod');
  if (/Failed to fetch|NetworkError|network/i.test(msg)) return t('offline');
  return msg.replace(/^[A-Z_]+:\s*/, '');
}

// Payroll rules shared with the HR system
let S = { weekendDays:[5,6], cycleStartDay:21, permissionsPerMonth:2, permissionMaxHours:2, annualLeaveDefault:21, casualCountsAnnual:'yes', hoursPerDay:8 };
let HOL = new Set();
function isWorkday(s){ return !(S.weekendDays||[]).includes(dObj(s).getDay()) && !HOL.has(s); }
function workdays(a,b){ if(!a||!b||b<a) return 0; let n=0,d=dObj(a),e=dObj(b),g=0; while(d<=e && g++<800){ if(isWorkday(dStr(d))) n++; d.setDate(d.getDate()+1); } return n; }
function cycleDay(){ const d=Math.round(num(S.cycleStartDay)); return (d>=2&&d<=28)?d:1; }
function periodStart(p){ const sd=cycleDay(),[y,m]=p.split('-').map(Number); if(sd===1) return `${p}-01`; const d=new Date(y,m-2,sd); return dStr(d); }
function periodEnd(p){ const sd=cycleDay(),[y,m]=p.split('-').map(Number); return sd===1 ? `${p}-${pad(new Date(y,m,0).getDate())}` : `${p}-${pad(sd-1)}`; }
function cycleOf(date){ const sd=cycleDay(),[y,m,d]=String(date).split('-').map(Number); if(sd===1||d<sd) return `${y}-${pad(m)}`; const n=new Date(y,m,1); return `${n.getFullYear()}-${pad(n.getMonth()+1)}`; }
function periodLabel(p){ const [y,m]=p.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString(loc(),{month:'long',year:'numeric'}); }
function leaveDaysIn(l,a,b){ const s=l.date_from>a?l.date_from:a, e=l.date_to<b?l.date_to:b; if(e<s) return 0; const full=workdays(l.date_from,l.date_to); if(!full) return 0; return Math.round(num(l.days)*workdays(s,e)/full*100)/100; }

const APP = { ready:false, me:null, emp:null, status:null, statusAt:0, leaves:[], perms:[], reqs:[], slips:[], att:[], manager:null, view:'home' };
let sb = null, tempPass = '';
function loginName(v){ v=String(v||'').trim(); return v.includes('@') ? v.toLowerCase() : v.toLowerCase().replace(/[^a-z0-9._-]/g,'') + '@' + LOGIN_DOMAIN; }
function errBox(id, msg){ const e=$(id); if(!msg){ e.style.display='none'; return; } e.textContent=msg; e.style.display='block'; }
async function doLogin(){
  const code=$('li-code').value.trim(), pass=$('li-pass').value;
  if (!code || !pass) return errBox('li-err', t('fillLogin'));
  const b=$('li-go'); b.disabled=true; b.innerHTML='<div class="spin"></div>';
  const { data, error } = await sb.auth.signInWithPassword({ email: loginName(code), password: pass });
  b.disabled=false; b.textContent=t('signIn');
  if (error) return errBox('li-err', /invalid/i.test(error.message) ? t('wrongLogin') : friendly(error.message));
  errBox('li-err'); tempPass = pass; $('li-pass').value=''; localStorage.setItem('pk_code', code);
  await afterLogin(data.user);
}
function message(txt){ $('msg-body').textContent = txt; show('scr-msg'); }
async function afterLogin(user){
  const { data } = await sb.from('app_users').select('*').eq('id', user.id);
  const me = data && data[0];
  if (!me || !me.role) return message(t('noRole'));
  if (!me.active) return message(t('inactive'));
  if (!me.emp_id) return message(t('notLinked'));
  APP.me = me;
  if (me.must_change_password){ ['fl-nid','fl-p1','fl-p2'].forEach(i=>$(i).value=''); errBox('fl-err'); show('scr-first'); return; }
  show('scr-main'); await loadAll(); APP.ready = true; renderAll();
}
async function firstLogin(){
  const nid=$('fl-nid').value.trim(), a=$('fl-p1').value, b=$('fl-p2').value;
  if (!/^\d{4}$/.test(nid)) return errBox('fl-err', t('need4'));
  if (a.length < 8) return errBox('fl-err', t('short'));
  if (a !== b) return errBox('fl-err', t('nomatch'));
  if (a === tempPass) return errBox('fl-err', t('sameTemp'));
  const btn=$('fl-go'); btn.disabled=true;
  const { data, error } = await sb.rpc('complete_first_login', { p_nid_last4:nid, p_new_password:a });
  btn.disabled=false;
  if (error) return errBox('fl-err', friendly(error.message));
  if (data !== 'ok') return errBox('fl-err', /do not match/.test(data) ? `${t('nidWrong')} ${t('attempts',{ n: (data.match(/(\d+) attempt/)||[])[1] || '' })}` : /locked/i.test(data) ? t('locked') : /different/.test(data) ? t('sameTemp') : data);
  tempPass=''; toast(t('passSet'));
  const { data: s } = await sb.auth.getSession(); await afterLogin(s.session.user);
}
async function signOut(){ try { await sb.auth.signOut(); } catch(e){} APP.ready=false; location.reload(); }

async function loadAll(){
  const id = APP.me.emp_id;
  const all = async (q) => { const r = await q; return r.data || []; };
  const [set, hol, emp, lv, pm, rq, sl, mg] = await Promise.all([
    all(sb.from('settings').select('*').eq('key','payroll')),
    all(sb.from('public_holidays').select('date')),
    all(sb.from('employees').select('*').eq('id', id)),
    all(sb.from('employee_leaves').select('*').eq('emp_id', id).order('date_from', { ascending:false })),
    all(sb.from('attendance_permissions').select('*').eq('emp_id', id).order('date', { ascending:false })),
    all(sb.from('hr_requests').select('*').eq('emp_id', id).order('created_at', { ascending:false })),
    all(sb.from('payroll_run_lines').select('*').eq('emp_id', id).order('period', { ascending:false })),
    sb.rpc('my_manager').then(r => r.data || [], () => []) ]);
  if (set[0] && set[0].value) S = { ...S, ...set[0].value };
  HOL = new Set(hol.map(h => h.date));
  APP.emp = emp[0] || null; APP.leaves = lv; APP.perms = pm; APP.reqs = rq; APP.slips = sl; APP.manager = mg[0] || null;
  await loadStatus();
}
async function loadStatus(){
  const { data, error } = await sb.rpc('my_clock_status');
  if (!error){ APP.status = data; APP.statusAt = Date.now(); }
  const cyc = cycleOf(APP.status ? APP.status.date : todayStr());
  const r = await sb.from('attendance').select('*').eq('emp_id', APP.me.emp_id).gte('date', periodStart(cyc)).lte('date', periodEnd(cyc)).order('date', { ascending:false });
  APP.att = r.data || [];
}

function serverNowMin(){ const st=APP.status; if(!st) return null; return toMin(st.now) + (Date.now()-APP.statusAt)/60000; }
function tick(){
  const m = serverNowMin();
  if (m !== null){ const mm=Math.floor(m)%1440; $('clk-time').textContent = `${pad(Math.floor(mm/60))}:${pad(mm%60)}`; }
  const o = APP.status && APP.status.open, el = $('clk-dur');
  if (o && el && m !== null){ const dayOff = Math.round((dObj(APP.status.date) - dObj(o.date))/86400000); const d = m + dayOff*1440 - toMin(o.in); el.textContent = `${Math.floor(d/60)}:${pad(Math.floor(d%60))}`; }
}

      + `<div class="it"><div class="grow t1">${esc(t('totalToday'))}</div><div class="num">${fmtH(tot)}</div></div>`
    : `<div class="empty">${esc(t('noToday'))}</div>`;

function getLocation(){
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({ lat:p.coords.latitude, lng:p.coords.longitude, accuracy:Math.round(p.coords.accuracy) }), () => res(null),
      { enableHighAccuracy:true, timeout:9000, maximumAge:30000 });
  });
}

    <div class="stat"><div class="v num">${open}</div><div class="l">${esc(t('openReq'))}</div></div>`;
  const items = [
    ...APP.leaves.map(l=>({ k:'leave', id:l.id, at:l.created_at, icon:'🌴', title:t('leaveTitle',{ t: tm('lt',l.leave_type) }), sub:`${niceDate(l.date_from)} → ${niceDate(l.date_to)} · ${fmt(l.days)} ${t('days')}`, st:l.status, reply:l.decision_note||'' })),
    ...APP.perms.map(p=>({ k:'perm', id:p.id, at:p.requested_at, icon:'✋', title:tm('pt',p.type), sub:`${niceDate(p.date)} · ${fmt(p.hours)} ${t('hours')}`, st:p.status, reply:p.decision_note||'' })),
    ...APP.reqs.map(r=>({ k:'req', id:r.id, at:r.created_at, icon:'📨', title:tm('ht',r.request_type), sub:r.details||'', st:r.status, reply:r.hr_response||'' })),
  ].sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
  $('req-list').innerHTML = items.map(x => `<div class="it"><div style="font-size:22px">${x.icon}</div><div class="grow"><div class="t1">${esc(x.title)}</div>
      <div class="t2">${esc(x.sub)}</div>${x.reply?`<div class="t2" style="color:var(--text)">💬 ${esc(x.reply)}</div>`:''}</div>
      <div style="text-align:end">${chip(x.st)}${x.st==='Pending'?`<div style="margin-top:6px"><button class="btn ghost small" data-cancel="${x.k}:${x.id}">${esc(t('cancelReq'))}</button></div>`:''}</div></div>`).join('')
    || `<div class="empty">${esc(t('noRequests'))}</div>`;
}
function opt(list, group){ return list.map(v=>`<option value="${esc(v)}">${esc(tm(group,v))}</option>`).join(''); }
function leaveSheet(){
  sheet(`<h2>🌴 ${esc(t('reqLeave'))}</h2>
    <div class="field"><label>${esc(t('type'))}</label><select id="lv-t">${opt(['Annual','Casual','Sick','Unpaid','Other paid'],'lt')}</select></div>
    <div class="row"><div class="field" style="flex:1"><label>${esc(t('from'))}</label><input type="date" id="lv-f" value="${todayStr()}"></div>
      <div class="field" style="flex:1"><label>${esc(t('to'))}</label><input type="date" id="lv-to" value="${todayStr()}"></div></div>
    <div class="field"><label>${esc(t('days'))}</label><input type="number" step="0.5" min="0.5" id="lv-d"></div>
    <div class="field"><label>${esc(t('reason'))}</label><input id="lv-r"></div>
    <div class="hint" id="lv-h"></div>
    <button class="btn" id="lv-go">${esc(t('send'))}</button>`);
  const re = () => { const f=$('lv-f').value, to=$('lv-to').value; if (f&&to&&to>=f) $('lv-d').value = workdays(f,to)||''; hint(); };
  const hint = () => {
    const f=$('lv-f').value, to=$('lv-to').value, ty=$('lv-t').value, d=num($('lv-d').value), out=[];
    if (f&&to&&to<f) out.push(`<span class="neg">${esc(t('toBefore'))}</span>`);
    if (f&&to&&to>=f) out.push(esc(t('wd',{ c: Math.round((dObj(to)-dObj(f))/86400000)+1, w: workdays(f,to) })));
    if (f && f < todayStr()) out.push(esc(t('past')));
    if (annualTypes().includes(ty)){ const left=entitlement()-yearDays(annualTypes(),'Approved')-yearDays(annualTypes(),'Pending')-d;
      out.push(`${esc(t('balAfter'))}: <b class="num ${left<0?'neg':'pos'}">${fmt(left)}</b>${left<0?` — <span class="neg">${esc(t('over'))}</span>`:''}`); }
    if (ty==='Unpaid') out.push(esc(t('unpaidNote'))); if (ty==='Sick') out.push(esc(t('sickNote')));
    if (f&&to && APP.leaves.some(l=>(l.status==='Approved'||l.status==='Pending')&&l.date_from<=to&&l.date_to>=f)) out.push(`<span class="neg">${esc(t('overlap'))}</span>`);
    $('lv-h').innerHTML = out.join('<br>');
  };
  ['lv-f','lv-to'].forEach(i=>$(i).addEventListener('change', re)); ['lv-t','lv-d'].forEach(i=>$(i).addEventListener('input', hint)); re();
  $('lv-go').onclick = () => {
    const f=$('lv-f').value, to=$('lv-to').value, d=num($('lv-d').value);
    if (!f||!to||to<f) return toast(t('toBefore'), true);
    if (d<=0) return toast(t('noDays'), true);
    if (APP.leaves.some(l=>(l.status==='Approved'||l.status==='Pending')&&l.date_from<=to&&l.date_to>=f)) return toast(t('overlap'), true);
    send('employee_leaves', { emp_id:APP.me.emp_id, leave_type:$('lv-t').value, date_from:f, date_to:to, days:d, status:'Pending', source:'Self-service',
                              reason:$('lv-r').value.trim()||null, entered_by:APP.me.full_name||APP.me.emp_id }, $('lv-go'));
  };
}
function permSheet(){
  const max = num(S.permissionMaxHours)||2;
  sheet(`<h2>✋ ${esc(t('reqPerm'))}</h2>
    <div class="field"><label>${esc(t('type'))}</label><select id="pm-t">${opt(['Late arrival','Early leave'],'pt')}</select></div>
    <div class="row"><div class="field" style="flex:1"><label>${esc(t('date'))}</label><input type="date" id="pm-d" value="${todayStr()}"></div>
      <div class="field" style="flex:1"><label>${esc(t('hoursL'))}</label><input type="number" step="0.25" min="0.25" max="${max}" id="pm-h" value="${max}"></div></div>
    <div class="field"><label>${esc(t('reason'))}</label><input id="pm-r"></div>
    <div class="hint" id="pm-hint"></div>
    <button class="btn" id="pm-go">${esc(t('send'))}</button>`);
  const hint = () => { const d=$('pm-d').value; if(!d) return; const cyc=cycleOf(d), lim=num(S.permissionsPerMonth)||2, u=APP.perms.filter(p=>p.status==='Approved'&&cycleOf(p.date)===cyc).length;
    $('pm-hint').innerHTML = esc(t('permCycle',{ p:periodLabel(cyc), u, l:lim })) + (u>=lim ? `<br><span class="neg">${esc(t('permFull'))}</span>` : ''); };
  $('pm-d').addEventListener('change', hint); hint();
  $('pm-go').onclick = () => {
    const d=$('pm-d').value, h=num($('pm-h').value), ty=$('pm-t').value;
    if (h<=0 || h>max) return toast(t('hoursRange',{ m:max }), true);
    if (APP.perms.some(p=>p.date===d && p.type===ty && (p.status==='Pending'||p.status==='Approved'))) return toast(t('dupPerm'), true);
    send('attendance_permissions', { emp_id:APP.me.emp_id, date:d, type:ty, hours:h, reason:$('pm-r').value.trim()||null, status:'Pending', source:'Self-service' }, $('pm-go'));
  };
}
function hrSheet(){
  sheet(`<h2>📨 ${esc(t('reqOther'))}</h2>
    <div class="field"><label>${esc(t('type'))}</label><select id="hq-t">${opt(['HR letter','Salary certificate','Experience certificate','Update my personal data','Payslip copy','Loan request','Other'],'ht')}</select></div>
    <div class="field"><label>${esc(t('details'))}</label><textarea id="hq-d"></textarea></div>
    <button class="btn" id="hq-go">${esc(t('send'))}</button>`);
  $('hq-go').onclick = () => {
    const ty=$('hq-t').value, d=$('hq-d').value.trim();
    if (!d && ['Update my personal data','Loan request','Other','HR letter'].includes(ty)) return toast(t('needDetails'), true);
    send('hr_requests', { emp_id:APP.me.emp_id, request_type:ty, details:d||null, status:'Pending' }, $('hq-go'));
  };
}
async function send(table, rec, btn){
  if (!navigator.onLine) return toast(t('offline'), true);
  btn.disabled = true;
  const { data, error } = await sb.from(table).insert(rec).select();
  btn.disabled = false;
  if (error || !(data && data.length)) return toast(friendly(error ? error.message : 'Not allowed'), true);
  closeSheet(); toast(t('sent')); await loadAll(); renderAll();
}
function askCancel(key){
  sheet(`<h2>${esc(t('cancelQ'))}</h2><div class="row"><button class="btn ghost" data-act="close">${esc(t('cancel'))}</button><button class="btn red" id="cx-go">${esc(t('yes'))}</button></div>`);
  $('cx-go').onclick = async () => {
    const [k,id]=key.split(':'), table={ leave:'employee_leaves', perm:'attendance_permissions', req:'hr_requests' }[k];
    const { data, error } = await sb.from(table).update({ status:'Cancelled' }).eq('id', id).select();
    if (error || !(data && data.length)) return toast(t('cantCancel'), true);
    closeSheet(); toast(t('cancelled')); await loadAll(); renderAll();
  };
}

// ═════════════════════════════════════════════════════════
//  PAYSLIPS & PROFILE
// ═════════════════════════════════════════════════════════
function renderPayslips(){
  $('pay-list').innerHTML = APP.slips.map(l => `<div class="it" data-slip="${esc(l.period)}" style="cursor:pointer"><div style="font-size:22px">💰</div>
      <div class="grow"><div class="t1">${esc(periodLabel(l.period))}</div><div class="t2">${esc(t('gross'))} <span class="num">${fmt(l.gross)}</span> · ${esc(t('ded'))} <span class="num">${fmt(l.deductions)}</span></div></div>
      <div class="num pos" style="font-size:16px">${fmt(l.net)}</div></div>`).join('') || `<div class="empty">${esc(t('noSlips'))}</div>`;
}
function slipSheet(period){
  const l = APP.slips.find(x=>x.period===period); if (!l) return;
  const lines = l.lines || [], row = x => `<div class="kv"><span class="k">${esc(x.name)}${x.note?`<div style="font-size:11.5px">${esc(x.note)}</div>`:''}</span><span class="v num ${x.type==='Deduction'?'neg':''}">${x.type==='Deduction'?'−':''}${fmt(x.amount)}</span></div>`;
  sheet(`<h2>💰 ${esc(periodLabel(period))}</h2><div class="hint">🔒 ${esc(t('approvedSlip'))}</div>
    <div class="sec">${esc(t('additions'))}</div>${lines.filter(x=>x.type==='Addition').map(row).join('')}
    <div class="kv"><span class="k"><b>${esc(t('gross'))}</b></span><span class="v num">${fmt(l.gross)}</span></div>
    <div class="sec" style="margin-top:12px">${esc(t('deductions'))}</div>${lines.filter(x=>x.type==='Deduction').map(row).join('') || '<div class="hint">—</div>'}
    <div class="kv"><span class="k"><b>${esc(t('ded'))}</b></span><span class="v num neg">${fmt(l.deductions)}</span></div>
    <div class="kv" style="font-size:18px"><span class="k"><b>${esc(t('net'))}</b></span><span class="v num pos">${fmt(l.net)}</span></div>`);
}
function renderProfile(){
  const e = APP.emp || {}, m = APP.manager;
  const kv = (k,v,ltr) => v ? `<div class="kv"><span class="k">${esc(t(k))}</span><span class="v ${ltr?'num':''}">${esc(v)}</span></div>` : '';
  $('prof-card').innerHTML = `<div class="sec" style="font-size:17px">${esc(LANG==='ar' ? (e.name_ar||e.name_en) : (e.name_en||e.name_ar))}</div>
    ${kv('code', e.id, true)}${kv('job', e.job_name)}${kv('dept', e.department)}${kv('unit', e.unit)}${kv('manager', m ? (LANG==='ar' ? (m.name_ar||m.name_en) : (m.name_en||m.name_ar)) : '')}
    ${kv('entity', e.entity)}${kv('hired', e.employment_date, true)}${kv('mobile', e.mobile, true)}${kv('email', e.email, true)}
    ${kv('nidL', e.national_id ? '•••• ' + String(e.national_id).slice(-4) : '', true)}`;
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const ic = $('install-card');
  if (standalone) ic.style.display='none';
  else if (installEvt) { ic.style.display=''; ic.innerHTML = `<div class="sec">📲 ${esc(t('install'))}</div><div class="hint">${esc(t('installAndroid'))}</div><button class="btn green" data-act="install">${esc(t('installBtn'))}</button>`; }
  else if (ios) { ic.style.display=''; ic.innerHTML = `<div class="sec">📲 ${esc(t('install'))}</div><div class="hint" style="margin:0">${esc(t('installIos'))}</div>`; }
  else ic.style.display='none';
}
function passSheet(){
  sheet(`<h2>🔑 ${esc(t('changePass'))}</h2>
    <div class="field"><label>${esc(t('newPass'))}</label><input type="password" id="cp1" autocomplete="new-password"></div>
    <div class="field"><label>${esc(t('repeatPass'))}</label><input type="password" id="cp2" autocomplete="new-password"></div>
    <button class="btn" id="cp-go">${esc(t('changePass'))}</button>`);
  $('cp-go').onclick = async () => {
    const a=$('cp1').value, b=$('cp2').value;
    if (a.length<8) return toast(t('short'), true); if (a!==b) return toast(t('nomatch'), true);
    const { error } = await sb.auth.updateUser({ password:a });
    if (error) return toast(friendly(error.message), true);
    closeSheet(); toast(t('passChanged'));
  };
}
function renderAll(){ if(!APP.ready) return; const e=APP.emp||{};
  $('me-name').textContent = LANG==='ar' ? (e.name_ar||e.name_en||APP.me.full_name||'') : (e.name_en||e.name_ar||APP.me.full_name||'');
  $('me-meta').textContent = `${APP.me.emp_id}${e.job_name?' · '+e.job_name:''}`;
  renderHome(); renderRequests(); renderPayslips(); renderProfile(); }
function go(view){ APP.view=view; document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on', v.id==='v-'+view)); document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.view===view)); window.scrollTo(0,0); }

// ═════════════════════════════════════════════════════════
//  EVENTS & START-UP
// ═════════════════════════════════════════════════════════
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (APP.ready) renderProfile(); });
document.addEventListener('click', async ev => {
  const x = ev.target;
  if (x.closest('[data-lang]')) { LANG = LANG==='ar' ? 'en' : 'ar'; localStorage.setItem('pk_lang', LANG); return applyLang(); }
  const tab = x.closest('[data-view]'); if (tab) return go(tab.dataset.view);
  if (x === $('sheet')) return closeSheet();
  const s = x.closest('.site'); if (s) return selectSite(s);
  const sl = x.closest('[data-slip]'); if (sl) return slipSheet(sl.dataset.slip);
  const cx = x.closest('[data-cancel]'); if (cx) return askCancel(cx.dataset.cancel);
  if (x.id === 'site-go' && pickSel) return clock('in', pickSel.code, x);
  if (x.id === 'out-go') return clock('out', null, x);
  const a = x.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act==='in' || act==='switch') return openSitePicker(act);
  if (act==='out') return confirmOut();
  if (act==='close') return closeSheet();
  if (act==='refresh') { await loadAll(); renderAll(); return toast('✓'); }
  if (act==='req-leave') return leaveSheet();
  if (act==='req-perm') return permSheet();
  if (act==='req-hr') return hrSheet();
  if (act==='chpass') return passSheet();
  if (act==='signout') return signOut();
  if (act==='install' && installEvt) { installEvt.prompt(); installEvt = null; return; }
});
$('li-go').addEventListener('click', doLogin);
['li-code','li-pass'].forEach(i => $(i).addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); }));
$('fl-go').addEventListener('click', firstLogin);
const net = () => { $('offline').style.display = navigator.onLine ? 'none' : 'block'; };
window.addEventListener('online', net); window.addEventListener('offline', net);
document.addEventListener('visibilitychange', async () => { if (document.visibilityState==='visible' && APP.ready && navigator.onLine){ await loadStatus(); renderHome(); } });
setInterval(() => { if (APP.ready) tick(); }, 15000);

(async function boot(){
  applyLang(); net();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  if (!window.supabase || !SUPABASE_KEY || SUPABASE_KEY.startsWith('PASTE')) return message(t('configMissing'));
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  $('li-code').value = localStorage.getItem('pk_code') || '';
  try {
    const { data } = await sb.auth.getSession();
    if (data && data.session) await afterLogin(data.session.user); else show('scr-login');
  } catch(e){ show('scr-login'); }
})();
</script>
</body>
